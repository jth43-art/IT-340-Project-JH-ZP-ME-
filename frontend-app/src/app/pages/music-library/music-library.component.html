<div class="music-library-page">

  <div class="library-header">

    <h1>Music Library</h1>

    <p>
      Browse all uploaded music tracks
    </p>

  </div>

  <div
    class="error-message"
    *ngIf="errorMessage"
  >
    {{ errorMessage }}
  </div>

  <div
    class="loading-message"
    *ngIf="loading"
  >
    Loading songs...
  </div>

  <div
    class="empty-library"
    *ngIf="
      !loading &&
      songs.length === 0 &&
      !errorMessage
    "
  >
    No uploaded songs found.
  </div>

  <div
    class="song-grid"
    *ngIf="
      !loading &&
      songs.length > 0
    "
  >

    <div
      class="song-card"
      *ngFor="let song of songs"
    >

      <div class="album-cover">

        <img
          *ngIf="song.albumArtworkPath"
          [src]="song.albumArtworkPath"
          alt="Album Cover"
        >

        <div
          class="album-placeholder"
          *ngIf="!song.albumArtworkPath"
        >
          🎵
        </div>

      </div>

      <div class="song-info">

        <h3>
          {{ song.title || 'Untitled Song' }}
        </h3>

        <p>
          <strong>Artist:</strong>
          {{ song.artist || 'Unknown Artist' }}
        </p>

        <p *ngIf="song.album">
          <strong>Album:</strong>
          {{ song.album }}
        </p>

        <p *ngIf="song.genre">
          <strong>Genre:</strong>
          {{ song.genre }}
        </p>

        <p *ngIf="song.createdAt">
          <strong>Uploaded:</strong>
          {{ song.createdAt | date:'mediumDate' }}
        </p>

      </div>

      <div class="song-actions">

        <button
          class="play-button"
          type="button"
          (click)="playSong(song)"
        >
          {{
            playingSongId === song._id
              ? '■ Stop Song'
              : '▶ Play Song'
          }}
        </button>

        <select
          class="playlist-select"
          #playlistSelect
        >

          <option value="">
            Select Playlist
          </option>

          <option
            *ngFor="let playlist of playlists"
            [value]="playlist._id"
          >
            {{
              playlist.title ||
              playlist.name ||
              'Untitled Playlist'
            }}
          </option>

        </select>

        <button
          class="add-playlist-button"
          type="button"
          (click)="
            addToPlaylist(
              song,
              playlistSelect.value
            )
          "
        >
          + Add to Playlist
        </button>

      </div>

    </div>

  </div>

</div>
