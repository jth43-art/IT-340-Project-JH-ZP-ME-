<div class="search-page">
  <div class="search-header">
    <h1>Search</h1>
    <div class="search-bar-container">
      <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Search for artists, songs, or albums...">
      <button (click)="onSearch()">Search</button>
    </div>
  </div>

  <div class="results-grid" *ngIf="songs.length > 0">
    <div class="song-card" *ngFor="let song of songs">
      <div class="card-content">
        <h3 class="song-name">{{ song.title }}</h3>
        <p class="artist-name">{{ song.artist }}</p>
      </div>
      
      <div class="card-actions">
        <select class="playlist-dropdown">
          <option value="" disabled selected>Select Playlist</option>
          <option *ngFor="let p of playlists" [value]="p.id">{{ p.name }}</option>
        </select>
        <button class="add-button">Add</button>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="songs.length === 0">
    <p>Enter a search term to find music.</p>
  </div>
</div>
