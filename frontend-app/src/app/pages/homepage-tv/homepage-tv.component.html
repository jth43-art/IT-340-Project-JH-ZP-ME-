<div class="tv-container">

  <div class="tv-card">

    <!-- HEADER NAVIGATION -->
    <header class="tv-header">
      <h1>TuneVault</h1>

      <nav class="tv-nav">
        <a routerLink="/homepage-tv">Home</a>
        <a routerLink="/search">Search</a>
        <a routerLink="/music-library">Music Library</a>
        <a routerLink="/playlists">Playlists</a>
        <a routerLink="/upload">Upload MP3</a>
        <a routerLink="/admin-dashboard" *ngIf="role === 'admin'">Admin Dashboard</a>
      </nav>
    </header>


    <div class="main-layout">

      <!-- USER / ACCOUNT SIDEBAR -->
      <aside class="user-corner">
        <div class="user-info">
          <p class="welcome-text">Welcome back,</p>
          <h2 class="username-text">{{ username }}</h2>
          <p class="role-badge">Role: {{ role }}</p>

          <!-- MFA SETTINGS BUTTON -->
          <button
            class="security-btn"
            type="button"
            (click)="manageMfa()"
          >
            {{ mfaEnabled ? 'Disable MFA' : 'Enable MFA' }}
          </button>

          <!-- LOGOUT BUTTON -->
          <button
            class="logout-btn-minimal"
            type="button"
            (click)="onLogout()"
          >
            Logout
          </button>
        </div>
      </aside>


      <!-- MAIN PLAYER CENTER -->
      <main class="player-center">

        <div class="visualizer">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <div class="track-info">
          <h2 class="song-title">Song Title</h2>
          <h3 class="artist-name">Artist Name</h3>
        </div>

        <div class="player-controls-large">
          <div class="progress-container">
            <div class="progress-bar"></div>
          </div>

          <div class="playback-details">
            <button class="play-circle">▶</button>
            <span class="timestamp">2:34 / 4:12</span>
          </div>
        </div>

      </main>

    </div>


    <!-- QUICK ACTION FOOTER BUTTONS -->
    <footer class="quick-links-footer">
      <button class="link-btn" routerLink="/music-library">
        🎵 Music Library
      </button>

      <button class="link-btn" routerLink="/search">
        🔍 Search Track
      </button>

      <button class="link-btn" routerLink="/upload">
        📤 Upload MP3
      </button>

      <button class="link-btn" routerLink="/playlists">
        📜 My Playlists
      </button>

      <button class="link-btn primary" type="button" (click)="openCreateModal()">
        + Create Playlist
      </button>

      <button class="link-btn admin-btn" routerLink="/admin-dashboard" *ngIf="role === 'admin'">
        ⚙️ Admin Panel
      </button>
    </footer>

  </div>

  <!-- CREATE PLAYLIST MODAL -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-card">
      <h3>Create New Playlist</h3>
      <input
        type="text"
        [(ngModel)]="newPlaylistName"
        placeholder="Enter playlist title..."
        class="modal-input"
      />
      <div class="modal-actions">
        <button class="link-btn" (click)="closeModal()">Cancel</button>
        <button class="link-btn primary" (click)="savePlaylist()">Save</button>
      </div>
    </div>
  </div>

</div>
