<div class="search-container">
  <input #searchInput type="text" placeholder="Search for songs or artists...">
  <button (click)="onSearch(searchInput.value)">Search</button>

  <div class="results" *ngIf="songs.length > 0">
    <div *ngFor="let song of songs" class="song-card">
      <p><strong>{{ song.title }}</strong> - {{ song.artist }}</p>
      <button (click)="addToPlaylist(song)">+ Add to Playlist</button>
    </div>
  </div>
</div>
