<div class="mfa-wrapper">

  <div class="mfa-card">

    <div class="mfa-top-bar">
      MFA
    </div>

    <div class="mfa-title">
      Verify Your Identity
    </div>

    <div class="mfa-instructions">
      Enter the 6-digit code from your authenticator app.
    </div>

    <form
      [formGroup]="mfaForm"
      (ngSubmit)="onVerify()"
    >

      <div class="field-label">
        Authentication Code
      </div>

      <div class="code-row">
        <span>[</span>

        <input
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
          formControlName="token"
        />

        <span>]</span>
      </div>

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div class="button-section">

        <button
          type="submit"
          [disabled]="isLoading"
        >
          {{
            isLoading
              ? 'VERIFYING...'
              : 'VERIFY'
          }}
        </button>

      </div>

    </form>

    <div class="back-section">
      <button
        type="button"
        class="back-link"
        (click)="backToLogin()"
      >
        Back to Login
      </button>
    </div>

  </div>

</div>
