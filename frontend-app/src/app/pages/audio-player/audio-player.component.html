<div class="audio-player-bar" *ngIf="currentSong">
  <div class="song-info">
    <img 
      [src]="currentSong.albumArtwork || currentSong.coverUrl || 'https://via.placeholder.com/50'" 
      alt="Cover" 
      class="player-artwork"
    >
    <div class="track-details">
      <span class="track-title">{{ currentSong.title || currentSong.track || 'Unknown Title' }}</span>
      <span class="track-artist">{{ currentSong.artist || 'Unknown Artist' }}</span>
    </div>
  </div>

  <div class="player-controls">
    <div class="buttons">
      <button class="control-btn play-btn" (click)="togglePlay()">
        {{ isPlaying ? '⏸' : '▶' }}
      </button>
    </div>

    <div class="progress-container">
      <span class="time-stamp">{{ formatTime(currentTime) }}</span>
      <input 
        type="range" 
        class="progress-bar"
        min="0" 
        [max]="duration || 0" 
        [value]="currentTime" 
        (input)="onSeek($event)"
      >
      <span class="time-stamp">{{ formatTime(duration) }}</span>
    </div>
  </div>

  <div class="volume-container">
    <span class="volume-icon">🔊</span>
    <input 
      type="range" 
      class="volume-bar"
      min="0" 
      max="1" 
      step="0.01" 
      [value]="volume" 
      (input)="onVolumeChange($event)"
    >
  </div>
</div>
