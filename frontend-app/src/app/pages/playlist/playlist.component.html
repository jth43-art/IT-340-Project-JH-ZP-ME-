

<div class="playlist-page">

  <div class="header">
    <h1>Your Library</h1>
    <p>Manage your playlists and songs.</p>
  </div>

  <div class="top-actions">
    <button (click)="showCreateBox = !showCreateBox">
      + Create Playlist
    </button>
  </div>

  <div
    *ngIf="showCreateBox"
    class="create-box"
  >

    <input
      type="text"
      [(ngModel)]="newPlaylistName"
      placeholder="Playlist name"
    >

    <button (click)="createPlaylist()">
      Save Playlist
    </button>

  </div>

  <div
    *ngIf="errorMessage"
    class="error-msg"
  >
    {{ errorMessage }}
  </div>

  <div class="playlist-grid">

    <div
      class="playlist-card"
      *ngFor="let list of playlists"
      (click)="openPlaylist(list)"
    >

      <div class="folder-icon">
        📂
      </div>

      <div class="playlist-info">

        <h3>
          {{ getPlaylistName(list) }}
        </h3>

        <p>
          {{ list.songs?.length || 0 }} Songs
        </p>

      </div>

      <div class="playlist-actions">

        <button
          (click)="deletePlaylist(list._id, $event)"
        >
          Delete
        </button>

      </div>

    </div>

    <div
      class="empty-state"
      *ngIf="playlists.length === 0 && !errorMessage"
    >

      <p>
        No playlists found. Create one above.
      </p>

    </div>

  </div>

  <div
    *ngIf="selectedPlaylist"
    class="playlist-editor"
  >

    <div class="editor-header">

      <h2>
        {{ getPlaylistName(selectedPlaylist) }}
      </h2>

      <button (click)="closePlaylist()">
        Close
      </button>

    </div>

    <div
      *ngIf="!selectedPlaylist.songs || selectedPlaylist.songs.length === 0"
      class="empty-playlist"
    >
      No songs in playlist.
    </div>

    <div
      class="song-row"
      *ngFor="let song of selectedPlaylist.songs; let i = index"
    >

      <div class="song-details">

        <div class="song-title">
          {{ getSongTitle(song) }}
        </div>

        <div class="song-artist">
          {{ getSongArtist(song) }}
        </div>

      </div>

      <div class="song-actions">

        <button
          class="spotify-btn"
          (click)="playOnSpotify(song, $event)"
        >
          Listen on Spotify
        </button>

        <button
          class="remove-btn"
          (click)="removeSong(i)"
        >
          Remove Song
        </button>

      </div>

    </div>

  </div>

</div>
