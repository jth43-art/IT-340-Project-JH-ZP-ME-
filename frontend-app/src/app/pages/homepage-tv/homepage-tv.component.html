<div class="tv-container">
  <div class="tv-card">
    <header class="tv-header">
      <h1>TuneVault - Home</h1>
      <nav class="tv-nav">
        <a routerLink="/homepage-tv">Home</a> | 
        <a routerLink="/library">Library</a> | 
        <a routerLink="/playlists">Playlists</a> | 
        <a routerLink="/upload">Upload</a>
      </nav>
    </header>

    <main class="tv-content">
      <div class="user-profile">
        <p>Welcome to TuneVault</p>
        <h2>Logged in as: <span class="highlight">{{ username }}</span></h2>
        <p class="role">Role: user</p>
        <button class="logout-btn" (click)="onLogout()">Logout</button>
      </div>

      <hr>

      <div class="now-playing">
        <h3>Now Playing: Song Title – Artist Name</h3>
        <div class="player-controls">
          <button>▶</button> <span>2:34 / 4:12</span>
        </div>
      </div>

      <div class="quick-links">
        <button routerLink="/recent">Recently Added</button>
        <button routerLink="/playlists">My Playlists</button>
        <button routerLink="/playlists/create">Create Playlist</button>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-box">
    <h2>Create New Playlist</h2>
    <input 
      type="text" 
      [(ngModel)]="newPlaylistName" 
      placeholder="Enter playlist name..."
      class="modal-input"
    >
    <div class="modal-buttons">
      <button class="cancel-btn" (click)="closeModal()">Cancel</button>
      <button class="save-btn" (click)="savePlaylist()">Create</button>
    </div>
  </div>
</div>
