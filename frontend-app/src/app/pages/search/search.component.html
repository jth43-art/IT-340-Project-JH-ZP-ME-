<div class="page-wrapper">
  <div class="search-header">
    <h1>Explore Music</h1>
    <div class="search-input-wrapper">
      <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Search for songs...">
      <button (click)="onSearch()">Search</button>
    </div>
  </div>

  <div class="results-grid" *ngIf="songs.length > 0">
    <div class="song-card" *ngFor="let song of songs">
      <div class="song-details">
        <h3 class="title">{{ song.title }}</h3>
        <p class="artist">{{ song.artist }}</p>
      </div>
      
      <div class="song-actions">
        <select class="playlist-dropdown">
          <option value="" disabled selected>Add to...</option>
          <option *ngFor="let p of playlists" [value]="p.id">{{ p.name }}</option>
        </select>
        <button class="add-btn">Add</button>
      </div>
    </div>
  </div>

  <div class="no-results" *ngIf="songs.length === 0">
    <p>Search for something to see results fill this space!</p>
  </div>
</div>
