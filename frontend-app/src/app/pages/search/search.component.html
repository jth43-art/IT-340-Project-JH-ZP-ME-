<div class="search-page">

  <div class="search-header">

    <h1>
      Search
    </h1>

    <div class="search-bar-container">

      <input
        type="text"
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
        placeholder="Search for artists, songs, or albums..."
        maxlength="60"
      >

      <button (click)="onSearch()">
        Search
      </button>

    </div>

    <div
      *ngIf="errorMessage"
      class="error-msg"
    >
      {{ errorMessage }}
    </div>

  </div>

  <div
    class="results-grid"
    *ngIf="songs.length > 0"
  >

    <div
      class="song-card"
      *ngFor="let song of songs"
    >

      <div class="card-content">

        <h3 class="song-name">
          {{ song.title || song.track || 'Untitled Song' }}
        </h3>

        <p class="artist-name">
          {{ song.artist || 'Unknown Artist' }}
        </p>

      </div>

      <div class="card-actions">

        <select
          class="playlist-dropdown"
          #playlistSelect
        >

          <option value="">
            Select Playlist
          </option>

          <option
            *ngFor="let p of playlists"
            [value]="p._id"
          >
            {{ p.title || p.name || 'Untitled Playlist' }}
          </option>

        </select>

        <button
          class="add-button"
          (click)="addToPlaylist(song, playlistSelect.value)"
        >
          Add
        </button>

      </div>

    </div>

  </div>

  <div
    class="empty-state"
    *ngIf="songs.length === 0 && !errorMessage"
  >
    <p>
      Enter a search term to find music.
    </p>
  </div>

</div>
